<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1e28" />
      <stop offset="100%" stop-color="#02080d" />
    </radialGradient>
    <linearGradient id="bodyGrad" x1="10%" y1="30%" x2="90%" y2="70%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="tailGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="40%" stop-color="#10b981" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="finGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)" stroke="#0e7490" stroke-width="1.5" />

  <!-- Flowing Guppy Tail -->
  <path d="M 28 32 C 34 26 40 18 52 14 C 48 24 54 30 52 34 C 54 38 48 44 52 50 C 40 46 34 38 28 32 Z" 
        fill="url(#tailGrad)" 
        filter="url(#glow)" />
  <path d="M 30 32 C 36 28 42 22 50 18 C 46 25 50 29 48 32 C 50 35 46 39 50 46 C 42 42 36 36 30 32 Z" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="0.75" 
        stroke-opacity="0.4" />

  <!-- Dorsal Fin -->
  <path d="M 20 27 C 22 18 28 17 31 20 C 27 23 25 26 22 28 Z" 
        fill="url(#finGrad)" />

  <!-- Pectoral / Ventral fin -->
  <path d="M 19 35 C 19 40 23 42 24 41 C 23 38 22 36 21 34 Z" 
        fill="url(#finGrad)" />

  <!-- Guppy Body -->
  <path d="M 12 32 C 12 28 18 26 28 29 C 32 30 33 32 33 32 C 33 32 32 34 28 35 C 18 38 12 36 12 32 Z" 
        fill="url(#bodyGrad)" />

  <!-- Belly highlight -->
  <path d="M 16 34 C 20 36 25 35 27 33" 
        stroke="#67e8f9" 
        stroke-width="1" 
        stroke-linecap="round" 
        opacity="0.8" />

  <!-- Eye -->
  <circle cx="16" cy="31" r="2" fill="#030712" />
  <circle cx="16" cy="31" r="1.3" fill="#f8fafc" />
  <circle cx="15.7" cy="30.7" r="0.7" fill="#020617" />
  <circle cx="15.4" cy="30.4" r="0.4" fill="#ffffff" />
</svg>
